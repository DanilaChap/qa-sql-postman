$kind: http-request
url: "{{base_url}}/users/1"
method: GET
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Username is Bret", function () {
          const data = pm.response.json();
          pm.expect(data.username).to.eql("Bret");
      });
    language: text/javascript
order: 1000
